name: Build Windows executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r finger_counter/requirements.txt pyinstaller

      - name: Download hand model
        run: >
          python -c "import sys; sys.path.insert(0, 'finger_counter');
          from finger_counter_app import download_model;
          sys.exit(0 if download_model() else 1)"

      - name: Build with PyInstaller
        working-directory: finger_counter
        run: >
          pyinstaller --onefile --windowed --name FingerCounter
          --collect-all mediapipe --collect-all cv2
          --add-data "models\hand_landmarker.task;models"
          finger_counter_app.py

      - name: Attach exe to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: finger_counter/dist/FingerCounter.exe

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FingerCounter-windows
          path: finger_counter/dist/FingerCounter.exe
